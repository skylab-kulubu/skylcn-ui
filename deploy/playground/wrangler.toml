# The public playground at https://playground.yildizskylab.com: the docs app's
# static export (DOCS_EXPORT=1) served as Workers static assets, with no script.
# .github/workflows/playground.yml deploys it on every push to main; the account
# comes from CLOUDFLARE_ACCOUNT_ID.
name = "skylcn-ui-playground"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../../apps/docs/out"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "playground.yildizskylab.com"
custom_domain = true
