name: Release

# Opens a "Version Packages" pull request from pending changesets; merging it
# stages the release on npm through trusted publishing (OIDC), so no npm token is
# kept. A maintainer then approves it on npmjs.com (Staged Packages) with 2FA.
# Stays off until the repository variable RELEASE_ENABLED is set to "true".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # npm 12 for trusted publishing and npm stage; no registry-url, whose
      # placeholder token in .npmrc would keep npm from the OIDC exchange
      - run: npm install -g npm@12
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance only from CI; a first release from a laptop cannot sign it
          NPM_CONFIG_PROVENANCE: 'true'
