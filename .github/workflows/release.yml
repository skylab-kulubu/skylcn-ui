name: Release

# Opens a "Version Packages" pull request from pending changesets; merging it
# publishes to npm through trusted publishing (OIDC), so no npm token is kept.
# Stays off until the repository variable RELEASE_ENABLED is set to "true",
# once the npm organisation and its trusted publisher are in place.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance only from CI; a first release from a laptop cannot sign it
          NPM_CONFIG_PROVENANCE: 'true'
